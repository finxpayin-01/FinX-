name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Test Suite & Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Test & Package Spring Boot Backend
        working-directory: ./backend
        run: |
          chmod +x mvnw
          ./mvnw clean test

  frontend-build:
    name: Frontend Lint & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Lint Frontend
        working-directory: ./frontend
        run: npm run lint

      - name: Build Next.js Production Bundle
        working-directory: ./frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080/api

  contracts-test:
    name: Solidity Build, Unit, Fuzz and Invariant Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: blockchain/contracts/package-lock.json
      - name: Install pinned contract tooling without lifecycle scripts
        working-directory: blockchain/contracts
        run: npm ci --ignore-scripts
      - name: Check formatting
        working-directory: blockchain/contracts
        run: npm run format:check
      - name: Compile and check contract sizes
        working-directory: blockchain/contracts
        run: npm run build
      - name: Unit, adversarial, fuzz and invariant tests
        working-directory: blockchain/contracts
        run: npm test
      - name: Dependency vulnerability gate
        working-directory: blockchain/contracts
        run: npm audit --audit-level=high

  deploy:
    name: Trigger Render Deployment
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build, contracts-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Trigger Render Deploy Hook (if configured)
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK }}" ]; then
            echo "RENDER_DEPLOY_HOOK secret not set in GitHub Actions repository secrets."
            echo "Note: If Render has native GitHub Auto-Deploy enabled on the Blueprint (render.yaml), Render automatically deploys upon git push to main!"
          else
            curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}
            echo "Triggered Render Deploy Hook successfully!"
          fi
