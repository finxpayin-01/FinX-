[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["node_modules"]
solc_version = "0.8.24"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
remappings = ["@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/"]

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 128
depth = 64
fail_on_revert = true
