server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: finx-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${SUPABASE_DB_HOST:localhost}:${SUPABASE_DB_PORT:5432}/${SUPABASE_DB_NAME:finx_db}}
    username: ${SPRING_DATASOURCE_USERNAME:${SUPABASE_DB_USERNAME:finx_user}}
    password: ${SPRING_DATASOURCE_PASSWORD:${SUPABASE_DB_PASSWORD:finx_password}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 60000
      initialization-fail-timeout: 60000
      max-lifetime: 1200000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          lob:
            non_contextual_creation: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      timeout: 2000ms

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  access-token-expiration-ms: ${JWT_ACCESS_TOKEN_EXPIRATION_MS:900000} # 15 minutes
  refresh-token-expiration-ms: ${JWT_REFRESH_TOKEN_EXPIRATION_MS:604800000} # 7 days

# Google OAuth 2.0 Configuration
oauth:
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/auth/google/callback}
    frontend-redirect-url: ${FRONTEND_OAUTH_CALLBACK_URL:${FRONTEND_URL:http://localhost:3000}/auth/callback/google}

google:
  client-id: ${GOOGLE_CLIENT_ID:}
  client-secret: ${GOOGLE_CLIENT_SECRET:}
  redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/auth/google/callback}
  frontend-redirect-url: ${FRONTEND_OAUTH_CALLBACK_URL:${FRONTEND_URL:http://localhost:3000}/auth/callback/google}

# CORS Configuration
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,https://finx-frontend.onrender.com,https://finx-frontend-19an.onrender.com,https://finx-frontend-*.onrender.com}
  allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
  allowed-headers: "*"
  allow-credentials: true
  max-age: 3600

# Rate Limiting Configuration
rate-limit:
  enabled: ${RATE_LIMIT_ENABLED:true}
  requests-per-minute: ${RATE_LIMIT_REQUESTS_PER_MINUTE:60}

# Springdoc OpenAPI Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  level:
    root: INFO
    com.finx: DEBUG
    org.springframework.security: INFO

spring.mail.host: smtp.ethereal.email
spring.mail.port: 587
spring.mail.username: ${SMTP_USER:finx-test@ethereal.email}
spring.mail.password: ${SMTP_PASS:password123}
spring.mail.properties.mail.smtp.auth: true
spring.mail.properties.mail.smtp.starttls.enable: true
mailersend:
  api-key: ${MAILERSEND_API_KEY:}
  domain: ${MAILERSEND_DOMAIN:}

# FinX Bank Integration Configuration
finx:
  banking:
    provider: ${BANK_PROVIDER:mock}
    currency: ${BANK_DEFAULT_CURRENCY:INR}
    mock:
      auto-settle: ${BANK_MOCK_AUTO_SETTLE:false}
      simulate-latency-ms: ${BANK_MOCK_LATENCY_MS:50}
    api-base-url: ${BANK_API_BASE_URL:}
    client-id: ${BANK_CLIENT_ID:}
    client-secret: ${BANK_CLIENT_SECRET:}
    webhook-secret: ${BANK_WEBHOOK_SECRET:finx-banking-webhook-secret-key-32chars}
  verification:
    provider: ${VERIFICATION_PROVIDER:mock}
    setu:
      base-url: ${SETU_BASE_URL:https://qa.setu.co/api}
      client-id: ${SETU_CLIENT_ID:}
      client-secret: ${SETU_CLIENT_SECRET:}
      product-instance-id: ${SETU_PRODUCT_INSTANCE_ID:}
  release:
    sandbox-dispatch:
      enabled: ${FINX_RELEASE_SANDBOX_DISPATCH_ENABLED:false}
    sandbox-finalization:
      enabled: ${FINX_RELEASE_SANDBOX_FINALIZATION_ENABLED:false}
