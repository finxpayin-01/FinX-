# Production Profile Configuration for FINX Spring Boot Backend (Render & Live Cloud)
server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:}}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      pool-name: FinxHikariProdPool
      max-lifetime: 600000
      connection-timeout: 60000
      initialization-fail-timeout: 60000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

  data:
    redis:
      url: ${SPRING_DATA_REDIS_URL:${REDIS_URL:}}
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      timeout: 2000ms

# Google OAuth 2.0 Production Defaults (Never fallback to localhost in prod)
oauth:
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:https://finx-backend-vq5b.onrender.com/api/auth/google/callback}
    frontend-redirect-url: ${FRONTEND_OAUTH_CALLBACK_URL:${FRONTEND_URL:https://finx-frontend.onrender.com}/auth/callback/google}

google:
  client-id: ${GOOGLE_CLIENT_ID:}
  client-secret: ${GOOGLE_CLIENT_SECRET:}
  redirect-uri: ${GOOGLE_REDIRECT_URI:https://finx-backend-vq5b.onrender.com/api/auth/google/callback}
  frontend-redirect-url: ${FRONTEND_OAUTH_CALLBACK_URL:${FRONTEND_URL:https://finx-frontend.onrender.com}/auth/callback/google}

# CORS Allowed Origins
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://finx-frontend.onrender.com,https://finx-frontend-i9an.onrender.com}
  allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
  allowed-headers: "*"
  allow-credentials: true
  max-age: 3600

# MailerSend Notification Configuration
mailersend:
  api-key: ${MAILERSEND_API_KEY:}
  domain: ${MAILERSEND_DOMAIN:}
