# Production Profile Configuration for FINX Spring Boot Backend (Render & Live Cloud)
server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:}}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      pool-name: FinxHikariProdPool
      max-lifetime: 600000
      connection-timeout: 60000
      initialization-fail-timeout: 60000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

  data:
    redis:
      url: ${SPRING_DATA_REDIS_URL:${REDIS_URL:}}
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      timeout: 2000ms

# Google OAuth 2.0 Production Defaults (Never fallback to localhost in prod)
oauth:
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:https://finx-backend-vq5b.onrender.com/api/auth/google/callback}
    frontend-redirect-url: ${FRONTEND_OAUTH_CALLBACK_URL:${FRONTEND_URL:https://finx-frontend.onrender.com}/auth/callback/google}

google:
  client-id: ${GOOGLE_CLIENT_ID:}
  client-secret: ${GOOGLE_CLIENT_SECRET:}
  redirect-uri: ${GOOGLE_REDIRECT_URI:https://finx-backend-vq5b.onrender.com/api/auth/google/callback}
  frontend-redirect-url: ${FRONTEND_OAUTH_CALLBACK_URL:${FRONTEND_URL:https://finx-frontend.onrender.com}/auth/callback/google}

# CORS Allowed Origins
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://finx-frontend.onrender.com,https://finx-frontend-19an.onrender.com,https://finx-frontend-*.onrender.com,http://localhost:3000,http://127.0.0.1:3000}
  allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
  allowed-headers: "*"
  allow-credentials: true
  max-age: 3600

# MailerSend Notification Configuration
mailersend:
  api-key: ${MAILERSEND_API_KEY:}
  domain: ${MAILERSEND_DOMAIN:}

# FinX Bank Integration Production Configuration
finx:
  banking:
    provider: ${BANK_PROVIDER:mock}
    currency: ${BANK_DEFAULT_CURRENCY:INR}
    api-base-url: ${BANK_API_BASE_URL:}
    client-id: ${BANK_CLIENT_ID:}
    client-secret: ${BANK_CLIENT_SECRET:}
    webhook-secret: ${BANK_WEBHOOK_SECRET:prod-banking-webhook-secret-key-32chars}
    partner:
      enabled: ${BANK_PARTNER_ENABLED:false}
      provider-name: ${BANK_PARTNER_NAME:}
      base-url: ${BANK_PARTNER_BASE_URL:}
      client-id: ${BANK_PARTNER_CLIENT_ID:}
      client-secret: ${BANK_PARTNER_CLIENT_SECRET:}
      sandbox: ${BANK_PARTNER_SANDBOX:true}
      production-execution-enabled: ${BANK_PARTNER_PRODUCTION_EXECUTION_ENABLED:false}
      connect-timeout-ms: ${BANK_PARTNER_CONNECT_TIMEOUT_MS:5000}
      read-timeout-ms: ${BANK_PARTNER_READ_TIMEOUT_MS:15000}
      mtls:
        enabled: ${BANK_PARTNER_MTLS_ENABLED:false}
        key-store-path: ${BANK_PARTNER_KEYSTORE_PATH:}
        key-store-password: ${BANK_PARTNER_KEYSTORE_PASSWORD:}
        key-store-type: ${BANK_PARTNER_KEYSTORE_TYPE:PKCS12}
        trust-store-path: ${BANK_PARTNER_TRUSTSTORE_PATH:}
        trust-store-password: ${BANK_PARTNER_TRUSTSTORE_PASSWORD:}
        trust-store-type: ${BANK_PARTNER_TRUSTSTORE_TYPE:PKCS12}
      signing:
        enabled: ${BANK_PARTNER_SIGNING_ENABLED:false}
        algorithm: ${BANK_PARTNER_SIGNING_ALGORITHM:HMAC-SHA256}
        key-id: ${BANK_PARTNER_SIGNING_KEY_ID:}
        private-key-path: ${BANK_PARTNER_SIGNING_PRIVATE_KEY_PATH:}
        secret: ${BANK_PARTNER_SIGNING_SECRET:}
      webhook:
        signature-algorithm: ${BANK_PARTNER_WEBHOOK_SIG_ALGORITHM:HMAC-SHA256}
        secret: ${BANK_PARTNER_WEBHOOK_SECRET:}
        public-key-path: ${BANK_PARTNER_WEBHOOK_PUBLIC_KEY_PATH:}
  release:
    sandbox-dispatch:
      enabled: ${FINX_RELEASE_SANDBOX_DISPATCH_ENABLED:false}
    sandbox-finalization:
      enabled: ${FINX_RELEASE_SANDBOX_FINALIZATION_ENABLED:false}
    production-execution:
      enabled: ${FINX_RELEASE_PRODUCTION_EXECUTION_ENABLED:false}

