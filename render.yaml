services:
  # ============================================================================
  # 1. Authoritative Backend: Spring Boot 3.4.3 / Java 21 / Docker Runtime
  # ============================================================================
  - type: web
    name: finx-backend
    env: docker
    plan: free
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "8080"
      - key: SPRING_PROFILES_ACTIVE
        value: "prod"
      - key: BANK_PROVIDER
        value: "mock"
      - key: BANK_DEFAULT_CURRENCY
        value: "INR"
      - key: BANK_API_BASE_URL
        sync: false
      - key: BANK_CLIENT_ID
        sync: false
      - key: BANK_CLIENT_SECRET
        sync: false
      - key: BANK_WEBHOOK_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: "https://finx-frontend.onrender.com,https://finx-frontend-19an.onrender.com,https://finx-frontend-*.onrender.com,http://localhost:3000,http://127.0.0.1:3000"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: "https://finx-backend-vq5b.onrender.com/api/auth/google/callback"
      - key: FRONTEND_URL
        value: "https://finx-frontend.onrender.com"
      - key: FRONTEND_OAUTH_CALLBACK_URL
        value: "https://finx-frontend.onrender.com/auth/callback/google"

  # ============================================================================
  # 2. Frontend: Next.js 16 App Router
  # ============================================================================
  - type: web
    name: finx-frontend
    env: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
      - key: NEXT_PUBLIC_API_URL
        value: "https://finx-backend-vq5b.onrender.com/api"
      - key: PORT
        value: "3000"
      - key: HOSTNAME
        value: "0.0.0.0"
      - key: NEXT_PUBLIC_GOOGLE_CLIENT_ID
        sync: false
      - key: NEXT_PUBLIC_GOOGLE_REDIRECT_URI
        value: "https://finx-backend-vq5b.onrender.com/api/auth/google/callback"
