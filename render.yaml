services:
  # ============================================================================
  # 1. Authoritative Backend: Spring Boot 3.4.3 / Java 21 / Docker Runtime
  # ============================================================================
  - type: web
    name: finx-backend
    env: docker
    plan: free
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "8080"
      - key: SPRING_PROFILES_ACTIVE
        value: "prod"
      - key: PAYMENT_RAIL
        value: "BLOCKCHAIN"
      - key: BLOCKCHAIN_ENABLED
        value: "true"
      - key: BLOCKCHAIN_TESTNET
        value: "true"
      - key: BLOCKCHAIN_NETWORK_NAME
        value: "Polygon Amoy"
      - key: BLOCKCHAIN_CHAIN_ID
        sync: false
      - key: BLOCKCHAIN_RPC_URL
        sync: false
      - key: ESCROW_FACTORY_ADDRESS
        sync: false
      - key: USDC_CONTRACT_ADDRESS
        sync: false
      - key: BLOCKCHAIN_CREATOR_ADDRESS
        sync: false
      - key: BLOCKCHAIN_ARBITRATOR_ADDRESS
        sync: false
      - key: BLOCKCHAIN_TOKEN_DECIMALS
        value: "6"
      - key: BLOCKCHAIN_TOKEN_SYMBOL
        value: "TEST-USDC"
      - key: BLOCKCHAIN_CONFIRMATIONS
        value: "12"
      - key: BLOCKCHAIN_START_BLOCK
        sync: false
      - key: BLOCKCHAIN_EXPLORER_URL
        sync: false
      - key: BLOCKCHAIN_WALLET_DOMAIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: "https://finx-frontend.onrender.com,https://finx-frontend-19an.onrender.com,https://finx-frontend-*.onrender.com,http://localhost:3000,http://127.0.0.1:3000"
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: RAZORPAY_SANDBOX_MODE
        value: "true"
      - key: RAZORPAY_CURRENCY
        value: "INR"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: "https://finx-backend-vq5b.onrender.com/api/auth/google/callback"
      - key: FRONTEND_URL
        value: "https://finx-frontend.onrender.com"
      - key: FRONTEND_OAUTH_CALLBACK_URL
        value: "https://finx-frontend.onrender.com/auth/callback/google"

  # ============================================================================
  # 2. Frontend: Next.js 16 App Router
  # ============================================================================
  - type: web
    name: finx-frontend
    env: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
      - key: NEXT_PUBLIC_API_URL
        value: "https://finx-backend-vq5b.onrender.com/api"
      - key: PORT
        value: "3000"
      - key: HOSTNAME
        value: "0.0.0.0"
      - key: NEXT_PUBLIC_RAZORPAY_KEY_ID
        sync: false
      - key: NEXT_PUBLIC_GOOGLE_CLIENT_ID
        sync: false
      - key: NEXT_PUBLIC_GOOGLE_REDIRECT_URI
        value: "https://finx-backend-vq5b.onrender.com/api/auth/google/callback"
